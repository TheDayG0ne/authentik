<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="color-scheme" content="light dark" />

        <title>{{.Title}}</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                font-size: 100%;
            }

            body {
                font-size: 16px;
                font-size: clamp(16px, 3dvw, 20px);
                background-color: #000;
                background-color: Canvas;
                color: #fff;
                color: CanvasText;
                font-family: system-ui, ui-sans-serif, sans-serif;
                display: grid;
                place-content: center;
                place-items: center;
                min-height: 100dvh;
                margin: 0;
                gap: 1rem;
            }


            hr {
              width: 100%;
              border-color: Field;
            }

            .logo {
                height: 2.75rem;
                max-width: 90dvw;
            }
        </style>
    </head>
    <body>
        <img class="logo" src="/static/dist/assets/tdgid/logo.svg" alt="TDG.id" role="heading" aria-level="1" />

        <hr />

        <div role="alert" aria-live="assertive">
            <h1>{{ .Title }}</h1>
            <p>{{ .Message }}</p>
        </div>
    </body>
</html>
