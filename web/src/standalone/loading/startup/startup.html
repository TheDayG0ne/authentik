<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="robots" content="noindex" />
        <meta name="color-scheme" content="light dark" />

        <title>TDG.id</title>
        <style>
            *,
            *::before,
            *::after {
                box-sizing: border-box;
            }

            html {
                font-size: 100%;
            }

            body {
                font-size: clamp(16px, 3dvw, 20px);
                background-color: #000;
                background-color: Canvas;
                color: #fff;
                color: CanvasText;
                font-family: system-ui, ui-sans-serif, sans-serif;
                text-align: center;
                display: grid;
                place-content: center;
                place-items: center;
                min-height: 100dvh;
                margin: 0;
                padding-block: 0 6em;
                padding-inline: 0.5em;
            }

            .logo {
                display: block;
                height: 3.5em;
                width: min(90dvw, 15em);
                object-fit: contain;
            }

            .container {
                position: absolute;
                left: 0;
                top: 50%;
                right: 0;
                bottom: 0;
                z-index: -1;
                overflow: hidden;
            }

            .container canvas {
                display: block;
            }
        </style>
    </head>
    <body>
        <img class="logo" src="/static/dist/assets/tdgid/logo.svg" alt="TDG.id" role="heading" aria-level="1" />

        <p>Server is starting up. Refreshing in a few seconds...</p>

        <div class="container" aria-hidden="true">
            <canvas id="waves-canvas"></canvas>
        </div>

        <script type="text/javascript">
            "use strict";

            let timeoutID = -1;

            function checkStatus() {
                console.log("Checking server status...");

                return fetch(window.location.href, {
                    method: "HEAD",
                    headers: {
                        "content-type": "application/json",
                    },
                })
                    .then((response) => {
                        if (response.ok) {
                            console.log("Server is ready! Reloading...");
                            clearTimeout(timeoutID);
                            window.location.reload();
                            return;
                        }

                        if (response.status === 503) {
                            throw new Error("Server is still starting up...");
                        }
                    })
                    .catch((error) => {
                        console.warn(`Checking server status failed: ${error}`);
                        timeoutID = setTimeout(checkStatus, 2000);
                    });
            }

            const queryParams = new URLSearchParams(window.location.search);

            if (window.location.origin.startsWith("http") && !queryParams.has("debug")) {
                console.log("Checking server status...");
                checkStatus();
            }
        </script>

        <script type="module">
            import("/static/dist/standalone/loading/wave-boi.mjs")
                .then(({ WavesCanvas }) => {
                    function drawAnimation() {
                        const canvas = document.getElementById("waves-canvas");
                        const waves = new WavesCanvas(canvas);
                        waves.play();
                    }

                    if (document.readyState === "loading") {
                        document.addEventListener("DOMContentLoaded", drawAnimation);
                    } else {
                        drawAnimation();
                    }
                })
                .catch((error) => {
                    console.debug("Skipping waves canvas:", error);
                });
        </script>
    </body>
</html>
