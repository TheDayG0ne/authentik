{% load static %}
{% load i18n %}
{% load authentik_core %}

<!DOCTYPE html>

<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}{% trans title|default:brand.branding_title %}{% endblock %}</title>
        {% include "base/branding_favicon.html" %}
        {% block head_before %}
        {% endblock %}
        <link rel="stylesheet" type="text/css" href="{% static 'dist/sfe/bootstrap.min.css' %}">
        <meta name="sentry-trace" content="{{ sentry_trace }}" />
        <link rel="prefetch" href="{{ flow_background_url }}" />
        {% include "base/header_js.html" %}
        <style data-id="flow-sfe">
          html,
          body {
            height: 100%;
          }
          body {
            position: relative;
            overflow: hidden;
            background:
              radial-gradient(ellipse at 74% 9%, #30124a 0, transparent 31%),
              radial-gradient(ellipse at 5% 45%, #160a24 0, transparent 26%), #050408;
            color: #f7f4ff;
            font-family: Manrope, "Red Hat Text", sans-serif;
          }
          body::before {
            content: "";
            position: fixed;
            inset: 0;
            pointer-events: none;
            opacity: .32;
            background-image: radial-gradient(#dabfff 1px, transparent 1px);
            background-size: 65px 65px;
            mask-image: linear-gradient(#000, transparent 70%);
          }
          .card {
            padding: 3rem;
          }

          .form-signin {
            max-width: 330px;
            padding: 1rem;
          }

          .form-signin .form-floating:focus-within {
            z-index: 2;
          }
          .brand-icon {
            max-width: 100%;
          }
        </style>
    </head>
    <body class="d-flex align-items-center py-4">
      <div class="card m-auto">
        <main class="form-signin w-100 m-auto" id="flow-sfe-container">
        </main>
        <span class="mt-3 mb-0 text-muted text-center">{% trans 'TDG.id (powered by authentik)' %}</span>
      </div>
      <script src="{% static 'dist/sfe/index.js' %}"></script>
    </body>
</html>
